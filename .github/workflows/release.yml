name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    # macOS so the darwin binaries get an ad-hoc signature; Bun cross-compiles the Linux ones.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Check the tag matches package.json
        run: |
          version=$(jq -r .version package.json)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"; exit 1; }

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

      - name: Package
        run: |
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            scripts/package.sh "$target"
          done
          cd dist && shasum -a 256 model-picker-*.tar.gz > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/model-picker-*.tar.gz

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/model-picker-*.tar.gz dist/SHA256SUMS install.sh --generate-notes
